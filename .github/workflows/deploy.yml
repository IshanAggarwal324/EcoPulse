name: Deploy Build

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry (requires REGISTRY secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config check
        run: docker compose config --quiet

  build-images:
    name: Build Service Images
    runs-on: ubuntu-latest
    needs: validate-compose
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: ai-service
            context: ai_service
          - name: genai-service
            context: genai-service
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build -t ecopulse/${{ matrix.name }}:ci-${{ github.sha }} ./${{ matrix.context }}

  build-frontend:
    name: Build Frontend Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecopulse/package-lock.json
      - run: npm ci --prefix ecopulse || npm install --prefix ecopulse
      - run: npm run build --prefix ecopulse
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ecopulse/dist
          retention-days: 7

  push-images:
    name: Push to Registry (optional)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event.inputs.push_images == 'true'
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: ai-service
            context: ai_service
          - name: genai-service
            context: genai-service
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        if: env.REGISTRY != ''
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "CONTAINER_REGISTRY secret not set — skipping push"
            exit 0
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - name: Build and push ${{ matrix.name }}
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          TAG="ecopulse/${{ matrix.name }}:${{ github.sha }}"
          docker build -t "$TAG" ./${{ matrix.context }}
          if [ -n "$REGISTRY" ]; then
            REMOTE="$REGISTRY/$TAG"
            docker tag "$TAG" "$REMOTE"
            docker push "$REMOTE"
          fi
