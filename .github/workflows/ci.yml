name: CI Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend || npm install --prefix backend
      - name: Syntax check
        run: |
          find backend -name '*.js' -not -path '*/node_modules/*' | xargs -I{} node -c {}
      - name: Run MVP tests
        run: npm test --prefix backend
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'test-access-secret-at-least-32-chars-long' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'test-refresh-secret-at-least-32-chars-long' }}
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecopulse/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix ecopulse || npm install --prefix ecopulse
      - name: Build
        run: npm run build --prefix ecopulse
        continue-on-error: true

  contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hardhat dependencies
        run: npm install
      - name: Run contract tests
        run: npx hardhat test
        continue-on-error: true

  ai-service:
    name: AI Service Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f ai_service/requirements.txt ]; then
            pip install -r ai_service/requirements.txt
          fi
      - name: Compile check
        run: |
          find ai_service -name '*.py' -not -path '*/__pycache__/*' | xargs -I{} python -m py_compile {}
