name: Retrain Forecast Model

# Module 4.2.2 — weekly scheduled retraining of the LSTM energy forecast.
#
# NOTE: In production this pipeline should run where the model registry and
# MongoDB are reachable (e.g. a Kubernetes CronJob in the same cluster). This
# workflow is provided as a portable alternative; it requires the runner to
# have network access to MongoDB (MONGODB_URI) and produces the new bundle in
# `models/registry`, uploaded as a workflow artifact. Wire a post-train upload
# step (S3/GCS/registry store) if the registry is not on shared storage.

on:
  schedule:
    # 03:00 UTC every Monday
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_promote:
        description: 'Promote the candidate regardless of MAPE improvement'
        required: false
        type: boolean
        default: false

jobs:
  retrain:
    name: Retrain + evaluate + (conditionally) promote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4

      # The job needs a MongoDB connection string. When the MONGODB_URI repository
      # secret is not set GitHub passes an empty string, and the script used to die
      # in ~1s with a cryptic "ConfigurationError: Empty host". Fail clearly for a
      # manual run; for the weekly schedule just skip with a notice instead of
      # sending a red X every Monday.
      - name: Check configuration
        id: cfg
        working-directory: .
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::The MONGODB_URI repository secret is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
            echo "::notice::Skipping scheduled retrain: MONGODB_URI repository secret is not set."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        run: pip install -r requirements.txt
      - name: Run retrain scheduler
        if: steps.cfg.outputs.configured == 'true'
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ECOPULSE_USE_DUMMY: 'false'
          ECOPULSE_RETRAIN_MIN_DAYS: '30'
          ECOPULSE_RETRAIN_FORCE: ${{ github.event.inputs.force_promote }}
        run: python -m jobs.retrain_scheduler

      - name: Upload registry artifact
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-registry-${{ github.run_id }}
          path: ai_service/models/registry
          if-no-files-found: warn
