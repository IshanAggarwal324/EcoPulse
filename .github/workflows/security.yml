name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  node-audit:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, ecopulse, genai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }} || npm install --prefix ${{ matrix.dir }}
      - name: Audit dependencies
        run: npm audit --audit-level=moderate --prefix ${{ matrix.dir }}

  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit ai_service dependencies
        run: |
          pip-audit -r ai_service/requirements.txt
          pip-audit -r genai-service/requirements.txt

  env-leak-check:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files tracked in git
        run: |
          if git ls-files | grep -E '\.env($|\.)' | grep -v '.example'; then
            echo "::error::Secret .env files are tracked in git!"
            exit 1
          fi
          echo "No tracked .env files found."
      - name: Check for hardcoded private keys
        run: |
          # Match assignment of a 64-char hex private key (not docs/examples/CI config).
          if git grep -nE 'PRIVATE_KEY=0x[0-9a-fA-F]{64}' \
            -- ':!*.example' ':!docs/*' ':!.kilo/*' ':!.github/*' ':!node_modules'; then
            echo "::error::Hardcoded private key found!"
            exit 1
          fi
          # Block the well-known Hardhat dev key if it appears anywhere in source.
          if git grep -n '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80' \
            -- ':!*.example' ':!docs/*' ':!.kilo/*' ':!.github/*' ':!node_modules'; then
            echo "::error::Known Hardhat default private key found in source!"
            exit 1
          fi
          echo "No hardcoded private keys found."
