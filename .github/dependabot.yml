version: 2
updates:
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/ecopulse"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # genai-service is a Python service: watch its pip requirements, not the
  # leftover Node lockfile from its earlier implementation.
  - package-ecosystem: pip
    directory: "/genai-service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: "/ai_service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
